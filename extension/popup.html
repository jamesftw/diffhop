<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>diffhop</title>
  </head>
  <body>
    <header>
      <h1>diffhop</h1>
    </header>
    <form id="form" novalidate>
      <label class="row toggle">
        <span class="label">Enabled</span>
        <input type="checkbox" id="enabled" />
      </label>

      <label class="row">
        <span class="label">Proxy port</span>
        <input type="number" id="port" min="1" max="65535" inputmode="numeric" />
      </label>

      <label class="row">
        <span class="label">Use local proxy <span class="hint">(private repos)</span></span>
        <input type="checkbox" id="useProxy" />
      </label>

      <p class="help">
        Public repos work with no setup. For private repos, run
        <code>npm run login</code> then <code>npm start</code>, and turn this on.
      </p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
