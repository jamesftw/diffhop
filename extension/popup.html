<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>diffhop</title>
  </head>
  <body>
    <header class="brand">
      <img class="mark" src="icons/icon48.png" alt="" width="20" height="20" />
      <h1>diffhop</h1>
    </header>
    <form id="form" novalidate>
      <label class="row toggle">
        <span class="label">Redirect to DiffsHub</span>
        <input type="checkbox" id="enabled" />
      </label>

      <div class="row stacked">
        <span class="label"
          >Private repos <span class="hint" id="authStatus">Not signed in</span></span
        >
        <button type="button" id="authBtn" class="btn">Sign in with GitHub</button>
        <p id="authMsg" class="help" role="status" aria-live="polite"></p>
      </div>

      <p class="help">
        Public repos work with no setup. For private repos, sign in once: approve the code
        on github.com and grant diffhop read-only access to the repos you choose.
      </p>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
