<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>diffhop</title>
  </head>
  <body>
    <header>
      <h1>diffhop</h1>
    </header>
    <form id="form" novalidate>
      <label class="row toggle">
        <span class="label">Enabled</span>
        <input type="checkbox" id="enabled" />
      </label>

      <div class="row stacked">
        <span class="label">Private repos <span class="hint" id="authStatus">Not signed in</span></span>
        <button type="button" id="authBtn" class="btn">Sign in with GitHub</button>
        <p id="deviceInfo" class="help" role="status" aria-live="polite"></p>
      </div>

      <p class="help">
        Public repos work with no setup. For private repos, sign in once —
        you'll approve a code on github.com (no token to copy).
      </p>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
